name: Test

on:
  push:
  pull_request:

# The job runs npm scripts and tests from the checked-out branch; nothing in it needs
# to write to the repository or keep a token in the checkout.
permissions:
  contents: read

jobs:
  checks:
    name: Theme checks
    runs-on: ubuntu-latest

    steps:
      # Full history: the shipped values check compares the tree with the latest release tag.
      - name: Checkout theme repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Every check that needs nothing outside this repo, then the zip and its byte budget:
      # the same run as a release preflight.
      - name: Run the package script
        run: bash bin/package-theme.sh

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout theme repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the test suite
        run: npm test

      - name: Keep the failure output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
