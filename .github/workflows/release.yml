name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  verify-master:
    name: Verify release tag is on master
    runs-on: ubuntu-latest

    steps:
      - name: Checkout theme repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm tagged commit is on master
        shell: bash
        run: |
          git fetch origin +refs/heads/master:refs/remotes/origin/master
          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          git merge-base --is-ancestor "$tag_commit" origin/master

      # The same preflight RELEASE.md runs before the tag: every repo check and the package
      # byte budget, on the tagged tree, so an oversized or broken package never reaches the
      # release job below.
      - name: Preflight the package
        shell: bash
        run: bash bin/package-theme.sh

      # The release job builds its zip with rsync and zip -r, not git archive, so the asset
      # it publishes is measured the same way here, against the budget the script holds.
      - name: Measure the zip the release job will publish
        shell: bash
        run: |
          budget="$(sed -n 's/^BUDGET_DEFAULT=//p' bin/package-theme.sh)"
          mkdir -p /tmp/measure/origin-canvas
          rsync -a --exclude-from=.distignore ./ /tmp/measure/origin-canvas/
          (cd /tmp/measure && zip -rq origin-canvas.zip origin-canvas/)
          bytes="$(stat -c%s /tmp/measure/origin-canvas.zip)"
          echo "release zip would be $bytes bytes, budget $budget"
          [ "$bytes" -le "$budget" ]

  release:
    needs: verify-master
    uses: origin-blocks/theme-workflows/.github/workflows/build-release.yml@v1
    with:
      theme-name: origin-canvas
      node-version: '22'
