# A release tag deploys the theme to the public demo and rebuilds the demo's content,
# through the shared workflow in origin-blocks/.github (see its README for the secrets).
name: Deploy

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']

jobs:
  deploy:
    uses: origin-blocks/.github/.github/workflows/deploy.yml@v1
    with:
      live: deploy-canvas-demo
      live-tags: true
      live-branches: ''
    secrets: inherit
